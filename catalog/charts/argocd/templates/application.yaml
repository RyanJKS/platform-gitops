{{- $_ := required "source.repoURL is required in cluster values" .Values.source.repoURL -}}
{{- $_ := required "source.path is required in cluster values" .Values.source.path -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  project: {{ .Values.project | quote }}
  source:
    {{- toYaml .Values.source | nindent 4 }}
  destination:
    {{- toYaml .Values.destination | nindent 4 }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
