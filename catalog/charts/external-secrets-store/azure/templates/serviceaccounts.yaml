{{- range $name, $account := .Values.serviceAccounts }}
{{- if ne $account.enabled false }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | quote }}
  namespace: {{ default $.Release.Namespace $account.namespace | quote }}
  labels:
    {{- include "key-vault-secrets.labels" $ | nindent 4 }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ default false $account.automountServiceAccountToken }}
{{- end }}
{{- end }}
