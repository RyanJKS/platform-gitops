{{- range $name, $store := .Values.clusterSecretStores }}
{{- if ne $store.enabled false }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "key-vault-secrets.labels" $ | nindent 4 }}
spec:
  {{- toYaml (required (printf "clusterSecretStores.%s.spec is required" $name) $store.spec) | nindent 2 }}
{{- end }}
{{- end }}
