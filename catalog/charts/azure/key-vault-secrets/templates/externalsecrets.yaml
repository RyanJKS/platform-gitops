{{- range $name, $secret := .Values.externalSecrets }}
{{- if ne $secret.enabled false }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ default $.Release.Namespace $secret.namespace | quote }}
  labels:
    {{- include "key-vault-secrets.labels" $ | nindent 4 }}
spec:
  {{- toYaml (required (printf "externalSecrets.%s.spec is required" $name) $secret.spec) | nindent 2 }}
{{- end }}
{{- end }}
