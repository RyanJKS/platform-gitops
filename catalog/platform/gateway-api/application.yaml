apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform-apps
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.3
    path: config/crd/standard
    directory:
      # Keep the same seven CRDs required by the Cilium profile.
      include: '{*gatewayclasses.yaml,*gateways.yaml,*httproutes.yaml,*grpcroutes.yaml,*referencegrants.yaml,*backendtlspolicies.yaml,*tlsroutes.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
