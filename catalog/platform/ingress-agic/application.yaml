apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-agic
  namespace: argocd
spec:
  project: platform-apps
  sources:
    - repoURL: mcr.microsoft.com/azure-application-gateway/charts
      chart: ingress-azure
      targetRevision: 1.8.1
      helm:
        releaseName: ingress-agic
        valueFiles:
          - $values/catalog/platform/ingress-agic/values.yaml
    - repoURL: https://github.com/RyanJKS/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-agic
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
