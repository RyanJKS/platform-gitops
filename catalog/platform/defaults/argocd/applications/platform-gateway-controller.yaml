apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gateway-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.3.2
      helm:
        releaseName: envoy-gateway
        valueFiles:
          - $values/catalog/platform/gateway/values.yaml
    - repoURL: https://github.com/RyanJKS/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
