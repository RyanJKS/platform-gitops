# Copy this mapping into the value of a cluster kustomization.yaml patch.
# Use op: replace and path: /spec/sources/0/helm/valuesObject.
# Install compatible Gateway API CRDs before syncing this Application.
ingressClass:
  enabled: false
  isDefaultClass: false

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
    experimentalChannel: false
    statusAddress:
      service:
        enabled: true

gatewayClass:
  enabled: true
  name: __PLACEHOLDER__ # GatewayClass name, for example traefik.

gateway:
  enabled: true
  name: __PLACEHOLDER__ # Gateway name, for example traefik-gateway.
  listeners:
    web:
      port: 8000
      protocol: HTTP
      hostname: __PLACEHOLDER__ # DNS hostname or wildcard hostname.
      namespacePolicy:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: __PLACEHOLDER__ # Workload namespace.
    websecure:
      port: 8443
      protocol: HTTPS
      hostname: __PLACEHOLDER__ # DNS hostname or wildcard hostname.
      namespacePolicy:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: __PLACEHOLDER__ # Workload namespace.
      mode: Terminate
      certificateRefs:
        - group: ""
          kind: Secret
          name: __PLACEHOLDER__ # Existing TLS Secret in the traefik namespace.

api:
  dashboard: false

service:
  # Set cloud-specific load balancer annotations in the cluster copy.
  annotations: {}
  spec:
    type: LoadBalancer

ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
    http:
      tls:
        enabled: true

# Define HTTPRoute resources in the cluster workload paths.
# No HTTP-to-HTTPS redirect is enabled by this template.
