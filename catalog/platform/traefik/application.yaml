apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform-apps
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 42.1.2
      helm:
        releaseName: traefik
        skipTests: true
        # Both profiles disable Traefik's custom resource provider.
        skipCrds: true
        # Pick configs/ingress/values.yaml or configs/gateway-api/values.yaml.
        # Copy its mapping into a cluster kustomization.yaml patch:
        # - op: replace
        #   path: /spec/sources/0/helm/valuesObject
        #   value: <selected values with real cluster settings>
        # Fill this object through the cluster patch before syncing.
        valuesObject: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
