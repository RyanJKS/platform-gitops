# Terraform helm_release values input; configure the official chart here.
# Azure AGIC terminates TLS at Application Gateway and forwards HTTP to Argo CD.
# The cluster supplies domain, issuer, and certificate hosts through extraTls.
configs:
  params:
    server.insecure: true
server:
  ingress:
    enabled: true
    controller: generic
    ingressClassName: azure-application-gateway
    annotations:
      acme.cert-manager.io/http01-edit-in-place: 'true'
      appgw.ingress.kubernetes.io/backend-protocol: http
      appgw.ingress.kubernetes.io/ssl-redirect: 'true'
    tls: false
