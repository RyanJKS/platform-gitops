# Copy into a cluster workload/configuration directory; replace every marker.
# Requires the Cilium GatewayClass and Gateway API CRDs.
# https://docs.cilium.io/en/stable/network/servicemesh/gateway-api/gateway-api/
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: __PLACEHOLDER__ # Gateway name.
  namespace: __PLACEHOLDER__ # Namespace containing this Gateway and its routes.
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      hostname: __PLACEHOLDER__ # Public or private DNS hostname.
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    # Optional HTTPS listener; provision the TLS Secret in this namespace first.
