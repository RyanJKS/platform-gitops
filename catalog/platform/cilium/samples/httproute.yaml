# Copy with gateway.yaml; replace every marker, including the integer port.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: __PLACEHOLDER__ # Route name.
  namespace: __PLACEHOLDER__ # Same namespace as the Gateway and backend Service.
spec:
  parentRefs:
    - name: __PLACEHOLDER__ # Gateway name.
      sectionName: http
  hostnames:
    - __PLACEHOLDER__ # Hostname matching the Gateway listener.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: __PLACEHOLDER__ # Existing backend Service name.
          port: __PLACEHOLDER__ # Integer Service port, for example 80.
