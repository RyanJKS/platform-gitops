apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform-apps
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.20.4
      helm:
        releaseName: cert-manager
        valuesObject:
          crds:
            enabled: true
          # Run the chart's API admission check during Sync, before the issuer wave.
          # Its default Helm post-install hook would become PostSync and run too late.
          startupapicheck:
            enabled: true
            timeout: 5m
            jobAnnotations:
              helm.sh/hook: null
              helm.sh/hook-weight: null
              helm.sh/hook-delete-policy: null
              argocd.argoproj.io/hook: Sync
              argocd.argoproj.io/sync-wave: "1"
              argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
            rbac:
              annotations:
                helm.sh/hook: null
                helm.sh/hook-weight: null
                helm.sh/hook-delete-policy: null
            serviceAccount:
              annotations:
                helm.sh/hook: null
                helm.sh/hook-weight: null
                helm.sh/hook-delete-policy: null
          global:
            leaderElection:
              namespace: cert-manager
          webhook:
            tolerations:
              - key: CriticalAddonsOnly
                operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
