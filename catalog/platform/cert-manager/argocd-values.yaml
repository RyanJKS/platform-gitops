# Run the chart's API admission check during Sync, before the issuer wave.
# Its default Helm post-install hook would become PostSync and run too late.
startupapicheck:
  enabled: true
  timeout: 5m
  jobAnnotations:
    helm.sh/hook: null
    helm.sh/hook-weight: null
    helm.sh/hook-delete-policy: null
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  rbac:
    annotations:
      helm.sh/hook: null
      helm.sh/hook-weight: null
      helm.sh/hook-delete-policy: null
  serviceAccount:
    annotations:
      helm.sh/hook: null
      helm.sh/hook-weight: null
      helm.sh/hook-delete-policy: null
