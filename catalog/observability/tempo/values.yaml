fullnameOverride: tempo
replicas: 1
tempo:
  reportingEnabled: false
  retention: 48h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
persistence:
  enabled: true
  size: 10Gi
serviceMonitor:
  enabled: true
