apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-market-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-market-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-market-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/ryanjks/atlas-market-worker:REPLACE_IMAGE_TAG
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
