apiVersion: v1
kind: ConfigMap
metadata:
  name: user-management-dbcreation-script
data:
  mysql_usermgmt.sql: |- # creates a .sql file script
    DROP DATABASE IF EXISTS webappdb;
    CREATE DATABASE webappdb;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-configs
data:
  db_hostname: "mysql.default.svc.cluster.local" ## ALWAYS USE FULL DNS HOST NAME FOR SERVICE <service name>.<namespace-name>.svc.cluster.local
  db_port: "3306"
  db_name: "webappdb"
  db_username: "root"
  db_password: "SecurePassword@1"
