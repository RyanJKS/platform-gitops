apiVersion:
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  replicas:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec: # pod spec
      containers:
        - name: mysql
          image: mysql:5.6
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: securepassword@1
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts: # container level resource
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql

            - name: user-management-dbcreation-script
              mountPath: /docker-entrypoint-initdb.d # this will run the specific type of file created. in this case the .sql file from configmap

      volumes: # pod level resource (needs to be attached first before reference at container level)
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: azure-managed-disk-pvc # this will create the PV and point it to the pod!

        - name: user-management-dbcreation-script # creates the db
          configMap:
            name: user-management-dbcreation-script
  strategy:
    type: Recreate # needed if there are database!
