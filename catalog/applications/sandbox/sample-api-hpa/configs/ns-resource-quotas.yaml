apiVersion: v1
kind: ResourceQuota
metadata:
  name: sample-api-ns-resource-quotas
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi # max this whole namespace can request
    limits.cpu: "2"
    limits.memory: 2Gi
    configmaps: "10"
    persistentvolumeclaims: "4"
    replicationcontrollers: "20"
    secrets: "10"
    services: "10"
