apiVersion: apps/v1
kind: Deployment
metadata:
  name: az-files-nginx-deployment
  namespace: default
  labels:
    app: az-files-nginx-app
spec:
  selector:
    matchLabels:
      app: az-files-nginx-app
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: az-files-nginx-app

    spec:
      containers:
        - name: az-files-nginx-app
          image: stacksimplify/kube-nginxapp1:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: az-fileshare-volume # point to below defined volume
              mountPath: "/usr/share/nginx/html/app1"

      volumes:
        - name: az-fileshare-volume
          persistentVolumeClaim:
            claimName: az-fileshare-pvc # point to custom claim
