apiVersion: storage,k8s.io/v1
kind: StorageClass
metadata:
  name: az-fileshare-sc
provisioner: kubernetes.io/azure-file # point to azure
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=0
  - gid=0
  - mfsymlinks
  - cache=strict
parameters:
  skuName: Standard_LRS # can be updated as needed (Standard_GRS)
