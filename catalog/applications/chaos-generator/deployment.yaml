apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-generator
  labels:
    app: chaos-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-generator
  template:
    metadata:
      labels:
        app: chaos-generator
    spec:
      containers:
      - name: chaos-generator-container
        image: ryanjks/chaos-generator:v1
        ports:
        - containerPort: 8501
