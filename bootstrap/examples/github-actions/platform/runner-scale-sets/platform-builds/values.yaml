githubConfigUrl: https://github.com/REPLACE_ME
githubConfigSecret: github-actions-app
runnerScaleSetName: platform-builds
minRunners: 0
maxRunners: 0
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller
template:
  spec:
    containers:
    - name: runner
      image: ghcr.io/actions/actions-runner:replace-me
      command:
      - /home/runner/run.sh
