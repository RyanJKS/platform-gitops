apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-actions-platform-builds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: platform
  sources:
  - repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.13.0
    helm:
      releaseName: platform-builds
      valueFiles:
      - $values/catalog/platform/github-actions/runner-scale-set/values.yaml
      - $values/bootstrap/examples/github-actions/platform/runner-scale-sets/platform-builds/values.yaml
  - repoURL: https://github.com/RyanJKS/platform-gitops.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
