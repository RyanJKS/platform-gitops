apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-kind
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RyanJKS/platform-gitops.git
    targetRevision: main
    path: clusters/local/kind/kind-platform/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
