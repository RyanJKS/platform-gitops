apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../catalog/platform/defaults/argocd
  - projects/atlas-ml.yaml
  - applications/platform-namespaces.yaml
  - applications/platform-policy.yaml
  - projects/platform.yaml
  - applications/platform-gateway-resources.yaml
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: platform-monitoring
    patch: |
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/clusters/local/kind/kind-platform/platform/monitoring/values.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: platform-gateway-controller
    patch: |
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/clusters/local/kind/kind-platform/platform/gateway/values.yaml
