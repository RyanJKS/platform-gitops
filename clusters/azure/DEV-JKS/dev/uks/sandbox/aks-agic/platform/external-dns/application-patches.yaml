- op: add
  path: /spec/sources/0/helm/valuesObject
  value:
    provider:
      name: azure
    podLabels:
      azure.workload.identity/use: "true"
    extraVolumes:
      - name: azure-config
        configMap:
          name: external-dns-azure
    extraVolumeMounts:
      - name: azure-config
        mountPath: /etc/kubernetes
        readOnly: true
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: 1f15d4be-1aec-4f4b-9090-b1e49817df4a # TODO: Update when needed
        azure.workload.identity/tenant-id: bac158f2-9dfe-4f66-b3e8-7fed8227d08f
    domainFilters:
      - jkslabs.site
    txtOwnerId: dev-uks-sandbox-aks-agic
    extraArgs:
      - --azure-config-file=/etc/kubernetes/azure.json
      - --ingress-class=azure-application-gateway
