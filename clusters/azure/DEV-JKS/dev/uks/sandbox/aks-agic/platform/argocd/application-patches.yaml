- op: add
  path: /spec/ignoreDifferences
  value:
    - group: networking.k8s.io
      kind: Ingress
      name: argocd-server
      namespace: argocd
      jqPathExpressions:
        - .spec.rules[]?.http.paths[]? | select((.path // "") | startswith("/.well-known/acme-challenge/"))
- op: add
  path: /spec/syncPolicy/syncOptions/-
  value: RespectIgnoreDifferences=true
- op: add
  path: /spec/sources/0/helm/valuesObject/global/domain
  value: argocd.jkslabs.site
- op: add
  # Preserve the pinned chart's appVersion instead of inheriting a runtime upgrade.
  path: /spec/sources/0/helm/valuesObject/global/image/tag
  value: ""
- op: add
  path: /spec/sources/0/helm/valuesObject/server/ingress
  value:
    enabled: true
    controller: generic
    ingressClassName: azure-application-gateway
    annotations:
      acme.cert-manager.io/http01-edit-in-place: 'true'
      appgw.ingress.kubernetes.io/backend-protocol: http
      appgw.ingress.kubernetes.io/ssl-redirect: 'true'
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls: false
    extraTls:
      - hosts:
          - argocd.jkslabs.site
        secretName: argocd-ingress-tls
- op: add
  path: /spec/sources/0/helm/valuesObject/server/replicas
  value: 3
- op: add
  path: /spec/sources/0/helm/valuesObject/controller
  value:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi
- op: add
  path: /spec/sources/0/helm/valuesObject/repoServer
  value:
    replicas: 2
- op: add
  path: /spec/sources/0/helm/valuesObject/redis-ha
  value:
    enabled: true
- op: add
  path: /spec/sources/0/helm/valuesObject/redis
  value:
    enabled: false
- op: add
  path: /spec/sources/0/helm/valuesObject/dex
  value:
    enabled: false
