- op: add
  path: /spec/sources/0/helm/valuesObject
  value:
    # Keep the deployed chart-generated names and the federated ServiceAccount subject.
    fullnameOverride: ingress-agic
    rbac:
      enabled: true
    armAuth:
      type: workloadIdentity
      identityClientID: 8f74341f-8989-43f8-8f70-fbe04704f5f4 # TODO: Update when needed
    appgw:
      shared: false
      usePrivateIP: false
      subscriptionId: 91c6f5e9-f6ab-400c-b5e7-265fd48053d3
      resourceGroup: SANDBOX-SHARED-UKS-DEV-RG
      name: sandboxuksdevagw
    kubernetes:
      ingressClassResource:
        enabled: true
        name: azure-application-gateway
        default: false
        controllerValue: azure/application-gateway
