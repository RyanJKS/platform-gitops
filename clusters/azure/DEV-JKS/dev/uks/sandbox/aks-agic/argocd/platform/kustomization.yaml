apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../../../../catalog/platform/cert-manager
  - ../../../../../../../../../catalog/platform/external-dns
  - ../../../../../../../../../catalog/platform/ingress-agic
patches:
  - path: revision-patches.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: (cert-manager|external-dns|ingress-agic)
  - path: cert-manager/application-patches.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: cert-manager
  - path: external-dns/application-patches.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: external-dns
  - path: ingress-agic/application-patches.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: ingress-agic
