apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Platform controllers selected for the AKS AGIC sandbox.
  sourceRepos:
    - https://github.com/RyanJKS/platform-gitops.git
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns/
    - mcr.microsoft.com/azure-application-gateway/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: ingress-agic
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: networking.k8s.io
      kind: IngressClass
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: apps
      kind: DaemonSet
    - group: ""
      kind: Pod
    - group: batch
      kind: Job
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  roles:
    - name: operator
      description: Inspect and sync platform Applications without changing their definitions.
      groups: []
      policies:
        - p, proj:platform-apps:operator, applications, get, platform-apps/*, allow
        - p, proj:platform-apps:operator, applications, sync, platform-apps/*, allow
        - p, proj:platform-apps:operator, logs, get, platform-apps/*, allow
