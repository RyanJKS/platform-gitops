crds:
  install: true
  keep: true

configs:
  params:
    server.insecure: false

server:
  service:
    type: ClusterIP
  ingress:
    enabled: false

controller:
  replicas: 1
repoServer:
  replicas: 1
redis-ha:
  enabled: false

# The chart templates its CRDs. Create the root only after they exist.
extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: all-apps
      namespace: argocd
      annotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-delete-policy: before-hook-creation
    spec:
      project: default
      source:
        repoURL: https://github.com/RyanJKS/platform-gitops.git
        targetRevision: feature/monitoring
        path: clusters/azure/DEV-JKS/dev/uks/sandbox/aks-envoy
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
