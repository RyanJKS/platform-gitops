apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cilium and Argo CD remain Helmfile-managed. Argo CD owns Gateway API CRDs.
resources:
  - ../../../../../../../catalog/platform/gateway-api
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: gateway-api
    patch: |-
      - op: replace
        path: /spec/project
        value: default
