- op: add
  # Gateway CRDs must exist before cert-manager discovers Gateway API support.
  path: /metadata/annotations/argocd.argoproj.io~1sync-wave
  value: "-3"
- op: add
  path: /spec/sources/0/helm/valuesObject/config
  value:
    enableGatewayAPI: true
- op: add
  path: /spec/sources/0/helm/valuesObject/serviceAccount
  value:
    create: true
    # Must match the name in the UAMI federated credential subject:
    # system:serviceaccount:cert-manager:cert-manager
    name: cert-manager
    annotations:
      azure.workload.identity/client-id: c920436c-454e-49d0-aa2d-9ae414e5507e
      azure.workload.identity/tenant-id: bac158f2-9dfe-4f66-b3e8-7fed8227d08f
- op: add
  path: /spec/sources/0/helm/valuesObject/podLabels
  value:
    azure.workload.identity/use: "true"
- op: add
  path: /spec/sources/0/helm/valuesObject/extraArgs
  value:
    - --cluster-issuer-ambient-credentials=true
- op: add
  # AKS injects these exact exclusions after each webhook apply.
  # Keep other namespace selectors and all remaining webhook settings managed.
  path: /spec/ignoreDifferences
  value:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: cert-manager-webhook
      jqPathExpressions:
        - >-
          .webhooks[]?.namespaceSelector.matchExpressions[]? |
          select(.key == "control-plane" and .operator == "NotIn" and .values == ["true"])
        - >-
          .webhooks[]?.namespaceSelector.matchExpressions[]? |
          select(.key == "kubernetes.azure.com/managedby" and .operator == "NotIn" and .values == ["aks"])
- op: add
  path: /spec/syncPolicy/syncOptions/-
  value: RespectIgnoreDifferences=true
