- op: add
  # Gateway CRDs must exist before cert-manager discovers Gateway API support.
  path: /metadata/annotations/argocd.argoproj.io~1sync-wave
  value: "-3"
- op: add
  path: /spec/sources/0/helm/valuesObject/config
  value:
    enableGatewayAPI: true
- op: add
  path: /spec/sources/0/helm/valuesObject/serviceAccount
  value:
    create: true
    # Must match the name in the UAMI federated credential subject:
    # system:serviceaccount:cert-manager:cert-manager
    name: cert-manager
    annotations:
      azure.workload.identity/client-id: 441857b2-40d0-4111-b4e7-51a40f22e57a
      azure.workload.identity/tenant-id: bac158f2-9dfe-4f66-b3e8-7fed8227d08f
- op: add
  path: /spec/sources/0/helm/valuesObject/podLabels
  value:
    azure.workload.identity/use: "true"
- op: add
  path: /spec/sources/0/helm/valuesObject/extraArgs
  value:
    - --cluster-issuer-ambient-credentials=true
