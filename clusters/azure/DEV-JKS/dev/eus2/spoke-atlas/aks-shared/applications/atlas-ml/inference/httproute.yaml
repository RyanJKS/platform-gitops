apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas-ml-inference
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - inference.atlas-ml.dev.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: atlas-ml-inference
          port: 80
