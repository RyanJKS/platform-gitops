name: Bug report
description: Report a reproducible problem. Report vulnerabilities privately instead.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example. Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the version or commit, Kubernetes and Argo CD versions, and operating system.
    validations:
      required: true
