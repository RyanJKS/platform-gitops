name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.17.3
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/render-applications/go.mod
          cache-dependency-path: scripts/render-applications/go.sum
      - name: Install validators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitops-bin"
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -o "$RUNNER_TEMP/gitops-bin/yq"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o "$RUNNER_TEMP/kubeconform.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/gitops-bin" kubeconform
          chmod +x "$RUNNER_TEMP/gitops-bin/"*
          echo "$RUNNER_TEMP/gitops-bin" >> "$GITHUB_PATH"
      - name: Validate manifests and render charts
        run: scripts/validate.sh
      - name: Check whitespace
        run: git diff --check
  docs:
    name: TechDocs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build documentation
        run: >-
          docker run --rm -v "$PWD:/content"
          -w /content spotify/techdocs:v1.2.6
          build --strict --site-dir /tmp/site
