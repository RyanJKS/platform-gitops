name: Set up Helm bootstrap
description: Install pinned tools and authenticate to the AKS BYOCNI cluster
inputs:
  azure-client-id:
    description: Azure federated identity client ID
    required: true
  azure-tenant-id:
    description: Azure tenant ID
    required: true
  azure-subscription-id:
    description: Azure subscription ID
    required: true
  aks-resource-group:
    description: AKS resource group
    required: true
  aks-cluster-name:
    description: Azure AKS resource name
    required: true
outputs:
  api-host:
    description: Direct API hostname of the selected cluster
    value: ${{ steps.aks.outputs.api-host }}
runs:
  using: composite
  steps:
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.18.6

    - name: Install kubelogin
      uses: azure/use-kubelogin@v1
      with:
        kubelogin-version: v0.2.12

    - name: Install Helmfile and helm-diff
      shell: bash
      env:
        HELMFILE_VERSION: "1.1.7"
        HELM_DIFF_VERSION: v3.12.5
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/helmfile"
        mkdir -p "$install_dir"
        cd "$install_dir"
        archive="helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
        release_url="https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}"
        curl --fail --location --retry 3 --output "$archive" "$release_url/$archive"
        curl --fail --location --retry 3 --output checksums.txt \
          "$release_url/helmfile_${HELMFILE_VERSION}_checksums.txt"
        awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' \
          checksums.txt > selected-checksum.txt
        sha256sum --check selected-checksum.txt
        tar -xzf "$archive" helmfile
        echo "$install_dir" >> "$GITHUB_PATH"
        helm plugin install https://github.com/databus23/helm-diff --version "$HELM_DIFF_VERSION"

    - name: Sign in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Check cluster networking and configure access
      id: aks
      shell: bash
      env:
        AKS_RESOURCE_GROUP: ${{ inputs.aks-resource-group }}
        AKS_CLUSTER_NAME: ${{ inputs.aks-cluster-name }}
      run: |
        set -euo pipefail
        : "${AKS_RESOURCE_GROUP:?Set AKS_RESOURCE_GROUP in the job environment}"
        : "${AKS_CLUSTER_NAME:?Set AKS_CLUSTER_NAME in the job environment}"
        network_plugin=$(az aks show --resource-group "$AKS_RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" --query networkProfile.networkPlugin --output tsv)
        if [[ "$network_plugin" != none ]]; then
          echo "::error::Helm-managed Cilium requires AKS BYOCNI (networkPlugin=none); found $network_plugin."
          exit 1
        fi
        export KUBECONFIG="$RUNNER_TEMP/aks-envoy.kubeconfig"
        echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
        az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" \
          --name "$AKS_CLUSTER_NAME" --file "$KUBECONFIG" --overwrite-existing
        kubelogin convert-kubeconfig --login azurecli
        kubectl cluster-info --request-timeout=30s
        api_server=$(kubectl config view --minify --output jsonpath='{.clusters[0].cluster.server}')
        api_host=$(python3 -c 'import sys; from urllib.parse import urlsplit; print(urlsplit(sys.argv[1]).hostname or "")' "$api_server")
        : "${api_host:?AKS kubeconfig must contain a direct API hostname}"
        echo "CILIUM_K8S_SERVICE_HOST=$api_host" >> "$GITHUB_ENV"
        echo "api-host=$api_host" >> "$GITHUB_OUTPUT"
